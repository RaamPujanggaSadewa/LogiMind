<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New request · LogiMind</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/logimind.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
  .page-head .title-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .page-head h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .foot { flex: none; padding: 0 24px 16px; }
  .foot-inner { max-width: 872px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .foot .composer { min-height: 64px; padding: 10px 10px 8px 16px; }
  .foot .composer textarea { min-height: 22px; }

  .for-customer { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .for-customer .org-avatar { width: 18px; height: 18px; font-size: 8.5px; border-radius: var(--r-xs); }

  /* Request card */
  .req-head-note { display: flex; align-items: center; gap: 12px; margin: -4px 0 12px; }
  .checks { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .checks li { display: grid; grid-template-columns: 16px 1fr; gap: 8px; font-size: 13px; color: var(--text-secondary); }
  .checks svg.lucide { width: 15px; height: 15px; margin-top: 2px; }
  .checks .success svg { color: var(--success); }
  .checks .info svg { color: var(--info); }
  .checks .warning svg { color: var(--warning); }

  .doc-table td { padding-top: 8px; padding-bottom: 8px; }
  .doc-table .by { color: var(--muted); font-size: 13px; }
  .doc-table .note { font-size: 12px; color: var(--muted); }
  .doc-table td:last-child { text-align: right; width: 1%; white-space: nowrap; }
  .sources { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .card-foot-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--divider); flex-wrap: wrap; }

  /* RFQ legs */
  .legs { display: flex; flex-direction: column; gap: 12px; }
  .leg { border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; transition: opacity .15s; }
  .leg.off .leg-body, .leg.off .leg-foot { display: none; }
  .leg.off .leg-head { opacity: .55; }
  .leg-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--row-hover); border-bottom: 1px solid var(--divider); }
  .leg.off .leg-head { border-bottom: 0; }
  .leg-n { width: 22px; height: 22px; border-radius: var(--r-xs); background: var(--surface); border: 1px solid var(--border); font-size: 12px; font-weight: 600; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
  .leg-head .svc { font-weight: 600; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .leg-head .where { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; padding-left: 4px; }
  .leg-head .right > * { white-space: nowrap; }
  .leg-head .svc svg.lucide { color: var(--muted); }
  .leg-head .route { color: var(--text-secondary); font-size: 13px; }
  .leg-head .when { color: var(--muted); font-size: 12px; }
  .leg-head .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .leg-body { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); }
  .leg-scope { padding: 14px 16px; border-right: 1px solid var(--divider); display: flex; flex-direction: column; gap: 10px; }
  .leg-scope .lbl, .leg-vendors .lbl { font-size: 12px; font-weight: 500; color: var(--muted); }
  .leg-scope ul { margin: 0; padding-left: 16px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .leg-scope li::marker { color: var(--muted-soft); }
  .leg-scope .meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; font-size: 12px; color: var(--muted); }
  .leg-vendors { padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 4px; }
  .vendor { display: grid; grid-template-columns: 16px 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 0; }
  .vendor .name { font-weight: 500; font-size: 13.5px; display: flex; align-items: center; gap: 6px; }
  .vendor .why { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0 6px; }
  .vendor .why { gap: 0 10px; }
  .vendor .why-note { display: block; font-size: 12px; color: var(--muted); }
  .vendor .score { text-align: right; line-height: 1.1; }
  .vendor .score b { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .vendor .score small { display: block; font-size: 11px; color: var(--muted-soft); }
  .vendor.unchecked .name, .vendor.unchecked .why, .vendor.unchecked .org-avatar, .vendor.unchecked .score { opacity: .5; }
  .thin-note { font-size: 12px; color: var(--warning); display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .thin-note svg.lucide { width: 13px; height: 13px; }
  .leg-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--divider); flex-wrap: wrap; }

  /* Vendor preview modal */
  .vp-brand { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: var(--r-md); background: var(--row-hover); border: 1px solid var(--divider); }
  .vp-brand .org-avatar { background: var(--primary); color: #fff; }
  .vp-grid { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; font-size: 13px; }
  .vp-grid dt { color: var(--muted); }
  .vp-grid dd { margin: 0; }
  .vp-price { display: flex; align-items: center; gap: 8px; }
  .vp-price input { height: 36px; border: 1px solid var(--border); border-radius: var(--r-sm); padding: 0 10px; width: 160px; background: var(--row-hover); }
  .hidden-list { margin: 0; padding: 12px 12px 12px 30px; background: var(--danger-soft); border-radius: var(--r-md); font-size: 13px; color: var(--text-secondary); display: flex; flex-direction: column; gap: 4px; }
  .hidden-list li::marker { color: var(--danger); }
  .review-leg { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--divider); }
  .review-leg:last-child { border-bottom: 0; }
  .review-leg .v { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .review-leg .v svg.lucide { width: 13px; height: 13px; color: var(--muted); }
  .notice { display: grid; grid-template-columns: 16px 1fr; gap: 8px; padding: 10px 12px; border-radius: var(--r-md); font-size: 13px; }
  .notice svg.lucide { width: 15px; height: 15px; margin-top: 1px; }
  .notice.warning { background: var(--warning-soft); color: var(--text-secondary); }
  .notice.warning svg { color: var(--warning); }
  .notice.info { background: var(--info-soft); color: var(--text-secondary); }
  .notice.info svg { color: var(--info); }
</style>
</head>
<body>
<div class="app" data-rail="home" data-row="chat-coffee">
  <div class="workspace">
    <main class="main">
      <header class="page-head">
        <div class="title-wrap">
          <h1 id="title"></h1>
          <span class="tag neutral" id="statusTag">Draft</span>
        </div>
        <span class="visibility"><i data-lucide="lock"></i>Internal: <b>Nusantara Cargo staff only</b></span>
        <div class="right"><nav class="stepper" id="stepper" aria-label="Progress"></nav></div>
      </header>

      <div class="content" id="scroll">
        <div class="thread" id="thread"></div>
      </div>

      <div class="foot">
        <div class="foot-inner">
          <div id="actionBar"></div>
          <form class="composer" data-composer>
            <textarea rows="1" placeholder="Ask for a change, e.g. “make it 3 containers” or “add 5 days of warehouse storage”" aria-label="Message"></textarea>
            <div class="composer-actions">
              <div class="left"><button type="button" class="attach-btn" title="Attach a document"><i data-lucide="paperclip"></i>Attach</button></div>
              <button type="submit" class="btn-primary send-btn neutral" title="Send" disabled><i data-lucide="arrow-up"></i></button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true" id="modal"></div></div>

<script src="assets/data.js"></script>
<script src="assets/shell.js"></script>
<script>
const { $, $$, esc, tag, visibility, orgAvatar, toast, icons, data: D } = LM;
LM.mount();

const R = D.request;
const params = new URLSearchParams(location.search);
const streaming = params.has('new');
let userPrompt = R.prompt;
if (streaming) { try { userPrompt = sessionStorage.getItem('lm.prompt') || R.prompt; } catch (e) {} }

const state = {
  sent: false,
  currency: 'USD',
  legOn: Object.fromEntries(R.legs.map(l => [l.id, true])),
  picked: Object.fromEntries(R.legs.flatMap(l => l.vendors.map(v => [`${l.id}:${v.org}`, v.pick]))),
  fields: R.fields.map(f => ({ ...f })),
};
const FX = { USD: ['US$', 1], IDR: ['Rp', 16300] };
const money = (usd) => FX[state.currency][0] + Math.round(usd * FX[state.currency][1]).toLocaleString('en-US');

$('#title').textContent = R.title;
document.title = `${R.title} · LogiMind`;

/* ---------------- stepper ---------------- */
function renderStepper() { $('#stepper').innerHTML = LM.stepperHTML(state.sent ? 3 : 2); }

/* ---------------- thread ---------------- */
function userMsgHTML() {
  const c = D.orgs[R.customer];
  return `<div class="msg-user fade-in">
    <div class="bubble">${esc(userPrompt)}</div>
    <span class="for-customer">For customer ${orgAvatar(R.customer)} ${c.name}</span>
  </div>`;
}

const PROV = {
  prompt:  ['From your prompt', 'message-square', ''],
  profile: ['From customer profile', 'building-2', ''],
  ai:      ['AI guess', 'sparkles', 'ai'],
  missing: ['Missing', 'circle-alert', 'missing'],
  edited:  ['Edited', 'pencil', 'edited'],
};

function requestCardHTML() {
  const missing = state.fields.filter(f => f.p === 'missing').length;
  return `<section class="card fade-in" id="reqCard">
    <div class="card-head"><i data-lucide="clipboard-list"></i><h3>Structured request</h3><span class="caption num">${R.id}</span>
      <div class="right">${missing ? tag(`${missing} missing`, 'warning') : tag('Complete', 'success', 'check')}</div>
    </div>
    <div class="req-head-note"><span class="ai-label"><i data-lucide="sparkles"></i>AI-extracted. Click any value to edit.</span></div>
    <div class="fields">
      ${state.fields.map((f, i) => {
        const [label, icon, cls] = PROV[f.p];
        return `<label class="field${f.p === 'missing' ? ' missing' : ''}">
          <span class="k">${f.k}<span class="prov ${cls}" title="${f.note || label}"><i data-lucide="${icon}"></i>${label}</span></span>
          <input value="${esc(f.v)}" data-field="${i}" placeholder="${f.p === 'missing' ? 'Add consignee' : ''}" aria-label="${f.k}">
          ${f.note && f.p !== 'edited' ? `<span class="hint">${f.note}</span>` : ''}
        </label>`;
      }).join('')}
    </div>
  </section>`;
}

const DOC_STATUS = {
  missing: ['Missing', 'warning'],
  rfq: ['In RFQ', 'neutral'],
  later: ['After loading', 'neutral'],
  ready: ['On file', 'success'],
  verify: ['Verify', 'info'],
};

function checklistCardHTML() {
  const missing = R.docs.filter(d => d.status === 'missing');
  return `<section class="card fade-in">
    <div class="card-head"><i data-lucide="files"></i><h3>Documents & compliance</h3><span class="caption">ID → CN · HS 0901.11</span>
      <div class="right">${tag(`${missing.length} missing`, 'warning')}</div>
    </div>
    <ul class="checks">${R.checks.map(c => `<li class="${c.tone}"><i data-lucide="${c.icon}"></i><span>${c.text}</span></li>`).join('')}</ul>
    <table class="table doc-table">
      <thead><tr><th>Document</th><th>Provided by</th><th>Status</th><th></th></tr></thead>
      <tbody>${R.docs.map(d => `<tr style="cursor:default">
        <td><div class="primary-cell">${d.name}</div>${d.note ? `<div class="note">${d.note}</div>` : ''}</td>
        <td class="by">${d.by}</td>
        <td>${tag(...DOC_STATUS[d.status])}</td>
        <td>${d.status === 'missing' ? `<button class="btn-secondary" data-request-doc="${esc(d.name)}"><i data-lucide="send"></i>Request</button>` : ''}</td>
      </tr>`).join('')}</tbody>
    </table>
    <div class="card-foot-row">
      <div class="sources"><span class="caption">Sources</span>${R.sources.map(([t, u]) => `<a class="source-link" href="${u}" onclick="return false"><i data-lucide="external-link"></i>${t}</a>`).join('')}</div>
      <button class="btn-secondary" id="requestAll"><i data-lucide="send"></i>Request ${missing.length} from customer</button>
    </div>
    <div style="margin-top:8px">${visibility('You. Document requests are shared with PT Kopi Nusantara only')}</div>
  </section>`;
}

function whyHTML(why) {
  return why.map(w => {
    const m = w.match(/^Last US\$([\d,]+)\/(\w+)$/);
    return `<span>${m ? `Last ${money(+m[1].replace(/,/g, ''))}/${m[2]}` : w}</span>`;
  }).join('');
}

function legHTML(l) {
  const on = state.legOn[l.id];
  const count = l.vendors.filter(v => state.picked[`${l.id}:${v.org}`]).length;
  return `<article class="leg${on ? '' : ' off'}" data-leg="${l.id}">
    <header class="leg-head">
      <span class="leg-n">${l.n}</span>
      <span class="svc"><i data-lucide="${l.icon}"></i>${l.service}</span>
      <span class="where"><span class="route">${l.route}</span><span class="when">${l.when}</span></span>
      <div class="right">
        ${l.confirm && !state.sent ? tag(l.confirm, 'warning', 'triangle-alert') : ''}
        ${state.sent && on ? tag('Sent · awaiting replies', 'info', 'clock') : `<span class="caption num">${count} vendor${count === 1 ? '' : 's'}</span>`}
        ${state.sent ? '' : `<label class="switch" title="Include this leg"><input type="checkbox" data-leg-toggle="${l.id}" ${on ? 'checked' : ''}>Include</label>`}
      </div>
    </header>
    <div class="leg-body">
      <div class="leg-scope">
        <span class="lbl">Scope the vendor sees</span>
        <ul>${l.scope.map(s => `<li>${s}</li>`).join('')}</ul>
        <div class="meta"><span>Reply by <b style="font-weight:500;color:var(--text-secondary)">${R.replyBy}</b></span>
          <button class="link-btn" data-preview="${l.id}"><i data-lucide="eye"></i>Preview as vendor</button></div>
      </div>
      <div class="leg-vendors">
        <span class="lbl">Suggested from your network</span>
        ${l.vendors.map(v => {
          const o = D.orgs[v.org], key = `${l.id}:${v.org}`, picked = state.picked[key];
          return `<label class="vendor${picked ? '' : ' unchecked'}">
            <input type="checkbox" class="check" data-pick="${key}" ${picked ? 'checked' : ''} ${state.sent ? 'disabled' : ''}>
            ${orgAvatar(v.org)}
            <span style="min-width:0">
              <span class="name">${o.name}${o.linkOnly ? tag('Link only', 'neutral', 'link') : ''}</span>
              <span class="why">${whyHTML(v.why)}</span>${o.linkOnly ? '<span class="why-note">Not on LogiMind yet. Gets a magic link by WhatsApp</span>' : ''}
            </span>
            <span class="score">${v.score ? `<b>${v.score}</b><small>match</small>` : '<small>New</small>'}</span>
          </label>`;
        }).join('')}
        ${l.thin ? `<div class="thin-note"><i data-lucide="info"></i>Only 1 fumigation vendor in your network.</div>` : ''}
      </div>
    </div>
    <footer class="leg-foot">
      ${visibility('You and the selected vendors. Each vendor sees only this leg and their own reply')}
      <label class="switch disabled" title="Marketplace is coming soon"><input type="checkbox" disabled>Also ask marketplace vendors ${tag('Coming soon', 'neutral')}</label>
    </footer>
  </article>`;
}

function rfqCardHTML() {
  return `<section class="card fade-in" id="rfqCard">
    <div class="card-head"><i data-lucide="file-stack"></i><h3>Draft RFQs by leg</h3><span class="caption">${R.legs.length} legs</span>
      <div class="right">
        <span class="ai-label"><i data-lucide="sparkles"></i>Vendors ranked by lane fit, on-time rate and price</span>
        <select class="select" id="currency" aria-label="Currency">
          ${Object.keys(FX).map(k => `<option${k === state.currency ? ' selected' : ''}>${k}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="legs">${R.legs.map(legHTML).join('')}</div>
  </section>`;
}

function aiIntroHTML() {
  const off = streaming && !/coffee/i.test(userPrompt)
    ? `<p class="caption" style="margin:0">Prototype note: this demo always plans the sample coffee shipment, whatever the prompt says.</p>` : '';
  return `<p class="fade-in">I’ve turned this into a structured request for <b>PT Kopi Nusantara</b>, checked the Indonesia → China rules for green coffee, and drafted <b>4 RFQs</b> split by leg with vendors from your network. Check the highlighted items, then review and send.</p>${off}`;
}

function totals() {
  const legs = R.legs.filter(l => state.legOn[l.id]);
  const vendors = new Set(legs.flatMap(l => l.vendors.filter(v => state.picked[`${l.id}:${v.org}`]).map(v => v.org)));
  const empty = legs.filter(l => !l.vendors.some(v => state.picked[`${l.id}:${v.org}`]));
  return { legs, vendors: vendors.size, empty };
}

function renderActionBar() {
  const bar = $('#actionBar');
  if (!$('#rfqCard')) { bar.innerHTML = ''; return; }
  if (state.sent) {
    bar.innerHTML = `<div class="action-bar fade-in">
      <span class="ai-mark" style="background:var(--success-soft);color:var(--success)"><i data-lucide="send"></i></span>
      <div class="summary"><b>RFQ-0194 sent: ${totals().legs.length} legs to ${totals().vendors} vendors</b>
        <div class="caption">Replies are due ${R.replyBy}. I’ll compare them as they arrive.</div></div>
      <a class="btn-secondary" href="rfq.html"><i data-lucide="arrow-up-right"></i>Open RFQ-0194</a>
    </div>`;
  } else {
    const t = totals();
    const missing = state.fields.filter(f => f.p === 'missing').length;
    const blocked = !t.legs.length || t.empty.length;
    const warn = t.empty.length ? `${t.empty.map(l => l.service).join(', ')} has no vendor selected`
      : missing ? `${missing} request field missing. Vendors don’t need it, so you can still send` : 'Everything checks out';
    bar.innerHTML = `<div class="action-bar">
      <div class="summary"><b>${t.legs.length} RFQ${t.legs.length === 1 ? '' : 's'} to ${t.vendors} vendors</b> <span class="muted">· replies by ${R.replyBy}</span>
        <div class="caption"><i data-lucide="shield-check"></i>Nothing is sent until you confirm. ${warn}.</div></div>
      <button class="btn-secondary" id="saveDraft"><i data-lucide="save"></i>Save draft</button>
      <button class="btn-primary" id="reviewSend" ${blocked ? 'disabled' : ''}><i data-lucide="send"></i>Review & send</button>
    </div>`;
  }
  icons();
}

/* ---------------- modals ---------------- */
function openModal(html) { $('#modal').innerHTML = html; $('#scrim').classList.add('open'); icons(); }
function closeModal() { $('#scrim').classList.remove('open'); $('#modal').innerHTML = ''; }
$('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim' || e.target.closest('[data-close]')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function previewModal(legId) {
  const l = R.legs.find(x => x.id === legId);
  const v = l.vendors.find(x => state.picked[`${l.id}:${x.org}`]) || l.vendors[0];
  const o = D.orgs[v.org];
  const unit = { truck: 'per truck', fumi: 'per container', customs: 'per shipment', ocean: 'per 40ft' }[l.id];
  openModal(`
    <div class="modal-head"><i data-lucide="eye"></i><h2>What ${o.name} sees</h2><button class="icon-btn" data-close title="Close"><i data-lucide="x"></i></button></div>
    <div class="modal-body">
      <div class="vp-brand"><span class="org-avatar">N</span><div><b style="font-weight:600">PT Nusantara Cargo</b> requests a quote<div class="caption">RFQ-0194 · Leg ${l.n}: ${l.service} · ${o.linkOnly ? 'opens from a WhatsApp magic link, no account needed' : 'in their LogiMind inbox'}</div></div></div>
      <dl class="vp-grid">
        <dt>Service</dt><dd>${l.service}</dd>
        <dt>Where</dt><dd>${l.route}</dd>
        <dt>When</dt><dd>${l.when}</dd>
        <dt>Cargo</dt><dd>2 × 40ft dry · green coffee beans · ~38.4 t</dd>
        <dt>Scope</dt><dd>${l.scope.join('<br>')}</dd>
        <dt>Reply by</dt><dd>${R.replyBy}</dd>
      </dl>
      <div class="vp-price"><input disabled placeholder="Your price (USD)"><span class="caption">${unit}</span></div>
      <div>
        <div class="caption" style="margin-bottom:6px;font-weight:500;color:var(--text-secondary)">Hidden from this vendor</div>
        <ul class="hidden-list">
          <li>Your customer’s price and your margin</li>
          <li>Other vendors invited and their prices</li>
          <li>The other legs of this shipment</li>
          ${l.id === 'ocean' || l.id === 'customs' ? '' : '<li>Customer contact details (pickup address only)</li>'}
        </ul>
      </div>
      ${visibility(`${o.name} and PT Nusantara Cargo`)}
    </div>
    <div class="modal-foot"><button class="btn-secondary" data-close>Close</button></div>`);
}

function reviewModal() {
  const t = totals();
  const missing = state.fields.filter(f => f.p === 'missing').length;
  openModal(`
    <div class="modal-head"><i data-lucide="send"></i><h2>Send ${t.legs.length} RFQs to ${t.vendors} vendors?</h2><button class="icon-btn" data-close title="Close"><i data-lucide="x"></i></button></div>
    <div class="modal-body">
      ${t.legs.map(l => `<div class="review-leg">
        <span class="leg-n">${l.n}</span>
        <div><b style="font-weight:600">${l.service}</b> <span class="muted" style="font-size:13px">· ${l.route}</span>
          ${l.vendors.filter(v => state.picked[`${l.id}:${v.org}`]).map(v => {
            const o = D.orgs[v.org];
            return `<div class="v">${o.linkOnly ? '<i data-lucide="message-circle"></i>' : '<i data-lucide="inbox"></i>'}${o.name}<span class="caption">· ${o.linkOnly ? 'WhatsApp magic link' : 'LogiMind inbox + email'}</span></div>`;
          }).join('')}
        </div>
      </div>`).join('')}
      ${state.legOn.ocean ? `<div class="notice warning"><i data-lucide="triangle-alert"></i><span>Ocean freight is included, but the Incoterm is FOB. Make sure PT Kopi Nusantara asked you to book it.</span></div>` : ''}
      ${missing ? `<div class="notice info"><i data-lucide="info"></i><span>The consignee is still missing. Vendors don’t see it, so these RFQs can go now. You’ll need it before booking.</span></div>` : ''}
      ${visibility('Each vendor sees only their own leg and reply')}
    </div>
    <div class="modal-foot">
      <span class="caption left">Replies due ${R.replyBy}</span>
      <button class="btn-secondary" data-close>Back to edit</button>
      <button class="btn-primary" id="confirmSend"><i data-lucide="send"></i>Send ${t.legs.length} RFQs</button>
    </div>`);
  $('#confirmSend').addEventListener('click', send);
}

function send() {
  closeModal();
  state.sent = true;
  $('#statusTag').className = 'tag info';
  $('#statusTag').textContent = 'RFQs out';
  $('#rfqCard .legs').innerHTML = R.legs.map(legHTML).join('');
  $$('#rfqCard .leg.off').forEach(el => el.remove());
  renderStepper();
  renderActionBar();
  $('#thread').insertAdjacentHTML('beforeend', `
    <div class="msg-ai fade-in"><span class="ai-mark"><i data-lucide="sparkles"></i></span>
      <div class="ai-body"><p>Sent. ${totals().vendors} vendors have RFQ-0194, and the link-only ones got a WhatsApp magic link. I’ll post each reply here and open a side-by-side comparison once every leg has at least 2 replies, or at the deadline.</p></div></div>`);
  icons();
  scrollBottom();
  toast(`RFQ-0194 sent to ${totals().vendors} vendors`);
}

/* ---------------- interactions ---------------- */
function bindThread() {
  const thread = $('#thread');
  thread.addEventListener('change', e => {
    const f = e.target.closest('[data-field]');
    if (f) {
      const field = state.fields[+f.dataset.field];
      field.v = f.value.trim();
      field.p = field.v ? 'edited' : (field.k.startsWith('Consignee') ? 'missing' : 'edited');
      $('#reqCard').outerHTML = requestCardHTML();
      icons();
      renderActionBar();
      toast(`${field.k} updated. Draft RFQs will use the new value`);
      return;
    }
    const lt = e.target.closest('[data-leg-toggle]');
    if (lt) { state.legOn[lt.dataset.legToggle] = lt.checked; rerenderLeg(lt.dataset.legToggle); return; }
    const pk = e.target.closest('[data-pick]');
    if (pk) { state.picked[pk.dataset.pick] = pk.checked; rerenderLeg(pk.dataset.pick.split(':')[0]); return; }
    if (e.target.id === 'currency') { state.currency = e.target.value; $('#rfqCard .legs').innerHTML = R.legs.map(legHTML).join(''); icons(); }
  });
  thread.addEventListener('click', e => {
    const p = e.target.closest('[data-preview]');
    if (p) { e.preventDefault(); previewModal(p.dataset.preview); return; }
    const rd = e.target.closest('[data-request-doc]');
    if (rd) { rd.disabled = true; rd.innerHTML = '<i data-lucide="check"></i>Requested'; icons(); toast(`Asked PT Kopi Nusantara for the ${rd.dataset.requestDoc.toLowerCase()}`); return; }
    if (e.target.closest('#requestAll')) {
      $$('[data-request-doc]').forEach(b => { b.disabled = true; b.innerHTML = '<i data-lucide="check"></i>Requested'; });
      e.target.closest('#requestAll').disabled = true;
      icons();
      toast('Document request sent to PT Kopi Nusantara');
    }
  });
}
function rerenderLeg(id) {
  const l = R.legs.find(x => x.id === id);
  $(`[data-leg="${id}"]`).outerHTML = legHTML(l);
  icons();
  renderActionBar();
}
$('#actionBar').addEventListener('click', e => {
  if (e.target.closest('#reviewSend')) reviewModal();
  if (e.target.closest('#saveDraft')) toast('Draft saved to AI Chats');
});

function scrollBottom() { const s = $('#scroll'); s.scrollTo({ top: s.scrollHeight, behavior: 'smooth' }); }

LM.bindComposer($('[data-composer]'), text => {
  $('#thread').insertAdjacentHTML('beforeend', `
    <div class="msg-user fade-in"><div class="bubble">${esc(text)}</div></div>
    <div class="msg-ai fade-in"><span class="ai-mark"><i data-lucide="sparkles"></i></span>
      <div class="ai-body"><div class="thinking"><div class="step"><i data-lucide="loader-circle" class="spin"></i>Updating the request…</div></div></div></div>`);
  icons();
  scrollBottom();
  setTimeout(() => {
    $$('#thread .ai-body').pop().innerHTML = `<p class="fade-in">Prototype: follow-up edits aren’t connected yet. In the product I’d update the request card, checklist and RFQ legs above and highlight what changed.</p>`;
    scrollBottom();
  }, 900);
});

/* ---------------- render ---------------- */
function renderAll() {
  renderStepper();
  const thread = $('#thread');
  thread.innerHTML = userMsgHTML() + `
    <div class="msg-ai"><span class="ai-mark"><i data-lucide="sparkles"></i></span><div class="ai-body" id="aiBody"></div></div>`;
  icons();
  bindThread();

  const blocks = [aiIntroHTML, requestCardHTML, checklistCardHTML, rfqCardHTML];
  const body = $('#aiBody');
  if (!streaming) {
    body.innerHTML = blocks.map(b => b()).join('');
    icons(); renderActionBar();
    return;
  }

  // Streaming: show reasoning steps, then reveal each block in turn
  const steps = ['Reading the request', 'Matching customer: PT Kopi Nusantara', 'Guessing HS code and equipment', 'Checking Indonesia → China rules', 'Splitting into legs', 'Ranking vendors in your network'];
  body.innerHTML = `<div class="thinking">${steps.map((s, i) => `<div class="step" data-i="${i}" style="display:none"><i data-lucide="loader-circle" class="spin"></i>${s}</div>`).join('')}</div>`;
  icons();
  const T = 420;
  steps.forEach((_, i) => setTimeout(() => {
    const prev = $(`.step[data-i="${i - 1}"]`, body);
    if (prev) { prev.classList.add('done'); prev.querySelector('svg').outerHTML = '<i data-lucide="circle-check"></i>'; }
    $(`.step[data-i="${i}"]`, body).style.display = 'flex';
    icons();
  }, i * T));
  setTimeout(() => {
    body.innerHTML = '';
    blocks.forEach((b, i) => setTimeout(() => {
      body.insertAdjacentHTML('beforeend', b());
      icons();
      if (i === blocks.length - 1) renderActionBar();
    }, i * 380));
    try { sessionStorage.removeItem('lm.prompt'); } catch (e) {}
    history.replaceState(null, '', 'chat.html');
  }, steps.length * T + 200);
}
renderAll();
</script>
</body>
</html>
