<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home · LogiMind</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/logimind.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
  .home { max-width: 1240px; margin: 0 auto; padding: 22px 32px 24px; display: flex; flex-direction: column; gap: 18px; }
  .sec-title { display: flex; align-items: center; gap: 8px; margin: 0 0 -6px; }
  .sec-title h2 { font-size: 14px; font-weight: 600; margin: 0; }
  .sec-title svg.lucide { width: 16px; height: 16px; color: var(--muted); }
  .sec-title .right { margin-left: auto; }

  /* compact composer */
  .quick { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 12px 10px 16px; border: 1px solid var(--border); border-radius: var(--r-xl); background: var(--surface); }
  .quick:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(91,61,224,.10); }
  .quick .forc { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: var(--r-full); background: var(--nav-active); font-size: 13px; font-weight: 500; color: var(--text-secondary); white-space: nowrap; }
  .quick .forc .org-avatar { width: 18px; height: 18px; font-size: 8px; border-radius: 4px; }
  .quick .forc.unset { background: var(--warning-soft); color: var(--warning); }
  .quick form { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .quick textarea { flex: 1; border: 0; outline: none; resize: none; min-height: 22px; max-height: 80px; background: transparent; line-height: 1.45; padding: 4px 0; }
  .quick textarea::placeholder { color: var(--muted-soft); }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
  @media (max-width: 1320px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  /* Delays and impact */
  .delay { display: flex; flex-direction: column; gap: 12px; }
  .delay-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .delay-top a.id { font-weight: 600; font-variant-numeric: tabular-nums; }
  .delay-top .right { margin-left: auto; display: flex; gap: 6px; }
  .delay .cause { font-size: 13.5px; color: var(--text-secondary); margin-top: -4px; }
  .dgrid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 12px; }
  .knock { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .knock li { display: grid; grid-template-columns: 16px 1fr; gap: 6px; font-size: 13px; color: var(--text-secondary); }
  .knock svg.lucide { width: 14px; height: 14px; margin-top: 2px; color: var(--warning); }
  .impact { background: var(--row-hover); border: 1px solid var(--divider); border-radius: var(--r-md); padding: 10px 12px; font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
  .impact .row2 { display: flex; justify-content: space-between; gap: 8px; }
  .impact b { font-variant-numeric: tabular-nums; font-weight: 600; }
  .impact .neg { color: var(--danger); }
  .mbar { height: 6px; border-radius: 99px; background: var(--nav-active); position: relative; overflow: hidden; }
  .mbar span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; }
  .mini-lbl { font-size: 11.5px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .eta { font-size: 13px; }
  .eta s { color: var(--muted); margin-right: 6px; }
  .delay-actions { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid var(--divider); }

  /* Pipeline */
  .pipe-stage { border-top: 1px solid var(--divider); padding: 10px 16px; }
  .pipe-stage:first-of-type { border-top: 0; }
  .pipe-stage .h { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
  .pipe-stage .h .n { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 500; }
  .pipe-item { display: flex; align-items: center; gap: 8px; padding: 5px 0 0; font-size: 12.5px; }
  .pipe-item a { font-weight: 500; font-variant-numeric: tabular-nums; }
  .pipe-item .t { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .pipe-item .reason { color: var(--warning); font-size: 12px; margin-left: 20px; }

  /* Status board */
  .board { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
  .lane-col { border: 1px solid var(--border); border-radius: var(--r-md); background: var(--row-hover); padding: 10px; display: flex; flex-direction: column; gap: 6px; min-height: 120px; }
  .lane-col .h { display: flex; align-items: baseline; justify-content: space-between; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); }
  .lane-col .h b { font-size: 18px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .chip-s { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--border); font-size: 12px; }
  .chip-s:hover { border-color: #CFCFD4; }
  .chip-s b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .chip-s .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); flex: none; }
  .chip-s .dot.warning { background: var(--warning); } .chip-s .dot.danger { background: var(--danger); } .chip-s .dot.new { background: var(--primary); }
  .lane-col .more { font-size: 11.5px; color: var(--muted); }
  @media (max-width: 1320px) { .board { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

  .fix { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; padding: 12px; border: 1px solid var(--border); border-radius: var(--r-md); }
  .fix.rec { border-color: var(--primary); background: var(--primary-soft); }
  .fix b { font-weight: 600; }
  .fix .d { font-size: 13px; color: var(--muted); }
  .fix .m { display: flex; gap: 14px; font-size: 12.5px; font-variant-numeric: tabular-nums; grid-column: 1 / -1; }
  .fix .m span { color: var(--muted); }
  .onboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .step { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .step .n { width: 24px; height: 24px; border-radius: 50%; background: var(--nav-active); font-size: 12px; font-weight: 600; display: grid; place-items: center; }
  .step h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .step p { margin: 0; color: var(--muted); font-size: 13px; flex: 1; }
  .proto-switch { display: inline-flex; gap: 4px; }
  .proto-switch a { font-size: 12px; color: var(--muted-soft); padding: 2px 6px; border-radius: var(--r-xs); }
  .proto-switch a.on { color: var(--text-secondary); background: var(--nav-active); }
</style>
</head>
<body>
<div class="app" data-rail="home" data-row="overview">
  <div class="workspace">
    <main class="main">
      <header class="page-head">
        <h1>Operations</h1>
        <span class="caption" id="today"></span>
        <span class="visibility" title="Who can see this page"><i data-lucide="lock"></i>Internal: <b>Nusantara Cargo staff only</b></span>
        <div class="right">
          <button class="pill selected" data-scope="mine"><i data-lucide="user"></i>My work</button>
          <button class="pill" data-scope="team"><i data-lucide="users"></i>Team</button>
        </div>
      </header>
      <div class="content"><div class="home" id="home"></div></div>
    </main>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/staff.js"></script>
<script>
const { $, $$, esc, tag, orgAvatar, toast, icons, db, data: D } = LM;
LM.mount();
const O = D.ops, T = Staff.T;
const state = new URLSearchParams(location.search).get('state') || 'active';
$('#today').textContent = D.today;
let forCustomer = null;
try { forCustomer = sessionStorage.getItem('lm.customer'); } catch (e) {}
if (forCustomer && !Staff.customer(forCustomer)) forCustomer = null;

/* ---------------- data ---------------- */
const reqs = Staff.requests();
const waiting = reqs.filter(r => ['new', 'review'].includes(r.status));
const oldest = waiting.reduce((m, r) => Math.max(m, Staff.waitingHours(r)), 0);
const quoted = reqs.filter(r => r.status === 'quoted');
const booked = (db.read().shipments || []).filter(s => s.tenant === LM.account.tenant);
const lost = [...reqs.filter(r => r.status === 'lost').map(r => ({ quote: r.quote.id, org: r.org, reason: r.decision.reason, when: 'Today' })), ...O.lost];
const overrun = O.overruns.reduce((s, o) => s + (o.actual - o.quoted), 0);

/* ---------------- sections ---------------- */
function kpisHTML() {
  const k = O.kpis;
  const tiles = [
    ['container', 'Active shipments', k.active + booked.length, booked.length ? `${booked.length} booked today` : 'Across 5 customers', '', '#board'],
    ['clock-alert', 'At risk / delayed', k.atRisk, '2 delayed · 1 customs hold', 'danger', '#delays'],
    ['inbox', 'Requests awaiting reply', waiting.length, waiting.length ? `Oldest waiting ${Math.floor(oldest)}h` : 'All answered', oldest > db.settings().slaHours ? 'danger' : 'warning', 'inbox.html'],
    ['receipt', 'Quotes awaiting customer', quoted.length + 1, quoted.length ? `${quoted.filter(r => r.quote.viewedAt || r.viewedAt).length} viewed` : '1 expires tomorrow', '', '#pipeline'],
    ['trending-up', 'Margin this month', Staff.money(k.margin), `${k.marginPct}% of revenue`, 'success', '#costs'],
    ['trending-down', 'Cost overrun this month', Staff.money(overrun), `${O.overruns.length} shipments over quote`, 'danger', '#costs'],
  ];
  return `<nav class="kpis" aria-label="Key figures">${tiles.map(([i, l, v, s2, tone, href]) => `<a class="kpi" href="${href}"><span class="k"><i data-lucide="${i}"></i>${l}</span><span class="v">${v}</span><span class="s ${tone}">${s2}</span></a>`).join('')}</nav>`;
}

function quickHTML() {
  const c = forCustomer && Staff.customer(forCustomer);
  return `<div class="quick" id="prompt">
    <button class="forc${c ? '' : ' unset'}" data-pick-customer title="Requests are always for one of your own customers">${c ? `${orgAvatar(forCustomer)}For ${esc(D.orgs[forCustomer].name)}` : '<i data-lucide="building-2" style="width:14px;height:14px"></i>For customer: choose…'}<i data-lucide="chevron-down" style="width:13px;height:13px"></i></button>
    <form data-composer>
      <textarea rows="1" placeholder="New request for a customer, e.g. 3 trucks Cikarang to Tanjung Priok Friday, 40ft" aria-label="New request"></textarea>
      <button type="button" class="attach-btn" title="Attach a WhatsApp screenshot or PO"><i data-lucide="paperclip"></i></button>
      <button type="submit" class="btn-primary send-btn neutral" title="Create request" disabled><i data-lucide="arrow-up"></i></button>
    </form>
  </div>`;
}

function delaysHTML() {
  return `<div class="sec-title" id="delays"><i data-lucide="clock-alert"></i><h2>Delays and impact</h2><span class="caption">${O.delays.length} delayed · 1 on customs hold</span></div>
    ${O.delays.map(d => {
      const c = Staff.customer(d.org), mb = d.cost.marginBefore, ma = d.cost.marginAfter;
      return `<section class="card delay">
        <div class="delay-top"><a class="id" href="shipment.html?id=${d.id}">${d.id}</a>${tag(`Delayed ${d.days} days`, d.severity, 'clock-alert')}
          <span class="caption">${esc(D.orgs[d.org].name)} · ${d.lane[0]} → ${d.lane[1]} · ${esc(d.cargo)}</span>
          <span class="right"><span class="eta"><s>${d.etaWas}</s><b style="font-weight:600">ETA ${d.eta}</b></span></span></div>
        <div class="cause">${esc(d.cause)}</div>
        <div class="dgrid">
          <div><div class="mini-lbl">Knock-on effects</div><ul class="knock">${d.knock.map(k => `<li><i data-lucide="corner-down-right"></i><span>${esc(k)}</span></li>`).join('')}</ul>
            <div class="mini-lbl" style="margin-top:10px">Customer affected</div><div style="font-size:13px;display:flex;align-items:center;gap:6px">${orgAvatar(d.org).replace('org-avatar', 'org-avatar" style="width:18px;height:18px;font-size:8px;border-radius:4px')}${esc(D.orgs[d.org].name)} · ${esc(c.contact)} ${c.portal === 'active' ? tag('Portal', 'success') : tag('WhatsApp only', 'neutral')}</div></div>
          <div class="impact"><div class="mini-lbl" style="margin:0">Cost implications <i data-lucide="lock" style="width:10px;height:10px"></i></div>
            ${d.cost.items.map(([l, a]) => `<div class="row2"><span>${esc(l)}</span><b class="neg">+${Staff.money(a)}</b></div>`).join('')}
            <div class="row2" style="border-top:1px solid var(--divider);padding-top:6px"><span>Margin on this shipment</span><b>${Staff.money(mb)} → <span class="neg">${Staff.money(ma)}</span></b></div>
            <div class="mbar"><span style="width:${mb / 700 * 100}%;background:var(--nav-active)"></span><span style="width:${ma / 700 * 100}%;background:var(--danger)"></span></div>
            <span class="caption">${Math.round((1 - ma / mb) * 100)}% less margin unless a fix recovers time or cost</span></div>
        </div>
        <div class="delay-actions">
          <button class="btn-secondary" data-fixes="${d.id}"><i data-lucide="wand-sparkles"></i>Suggested fixes (${d.fixes.length})</button>
          <button class="btn-secondary" data-notify="${d.id}"><i data-lucide="send"></i>Notify customer</button>
          <a class="link-btn" href="shipment.html?id=${d.id}" style="margin-left:auto">Delay detail<i data-lucide="arrow-right"></i></a>
        </div>
      </section>`;
    }).join('')}
    <section class="card" style="display:flex;align-items:center;gap:10px;padding:12px 16px"><span class="icon-tile tone-warning"><i data-lucide="shield-alert"></i></span>
      <div style="flex:1"><b style="font-weight:600">${O.hold.id} · ${esc(D.orgs[O.hold.org].name)}</b> <span class="caption">${esc(O.hold.cause)} · 1 day so far · inspection fee +US$220</span></div>
      <a class="link-btn" href="#costs">Cost vs quote<i data-lucide="arrow-right"></i></a></section>`;
}

function pipelineHTML() {
  const stages = [
    ['New', 'sparkles', reqs.filter(r => r.status === 'new'), r => Staff.timerHTML(r)],
    ['In review', 'eye', reqs.filter(r => r.status === 'review'), r => Staff.timerHTML(r)],
    ['Quoted · awaiting customer', 'send', quoted, r => (r.quote.viewedAt || r.viewedAt) ? tag('Viewed', 'info', 'eye') : tag('Not opened', 'neutral')],
    ['Accepted · booked', 'badge-check', reqs.filter(r => r.status === 'booked'), r => tag(r.decision.shipment, 'success')],
  ];
  return `<section class="card flush" id="pipeline">
    <div class="card-head"><i data-lucide="git-pull-request-arrow"></i><h3>Requests and quotes</h3><div class="right"><a class="link-btn" href="inbox.html">Inbox<i data-lucide="arrow-right"></i></a></div></div>
    <div style="margin-top:6px">
      ${stages.map(([l, i, list, extra]) => `<div class="pipe-stage"><div class="h"><i data-lucide="${i}" style="width:14px;height:14px;color:var(--muted)"></i>${l}<span class="n">${list.length}</span></div>
        ${list.slice(0, 3).map(r => `<div class="pipe-item"><a href="request.html?id=${r.id}">${r.id}</a><span class="t">${esc(D.orgs[r.org].name)} · ${esc(r.title)}</span>${extra(r)}</div>`).join('')}</div>`).join('')}
      <div class="pipe-stage"><div class="h"><i data-lucide="x" style="width:14px;height:14px;color:var(--muted)"></i>Lost<span class="n">${lost.length}</span></div>
        ${lost.map(l => `<div class="pipe-item"><b style="font-weight:500">${l.quote}</b><span class="t">${esc(D.orgs[l.org].name)} · ${l.when}</span></div><div class="pipe-item reason">${esc(l.reason)}</div>`).join('')}</div>
    </div>
  </section>`;
}

function boardHTML() {
  const DOT = { 'SHP-2402': 'danger', 'SHP-2386': 'warning', 'SHP-2390': 'warning', 'SHP-2411': 'warning' };
  const href = (id) => id === 'SHP-2411' ? 'shipment.html' : `shipment.html?id=${id}`;
  const board = O.board.map(b => b.stage === 'Booked' ? { ...b, count: b.count + booked.length, items: [...booked.map(s => s.id), ...b.items] } : b);
  return `<div class="sec-title" id="board"><i data-lucide="kanban"></i><h2>Status board</h2><span class="caption">Booked → Delivered · click a shipment to open it</span>
      <div class="right"><span class="caption"><span style="color:var(--danger)">●</span> delayed · <span style="color:var(--warning)">●</span> at risk · <span style="color:var(--primary)">●</span> new</span></div></div>
    <div class="board">${board.map(b => `<div class="lane-col"><div class="h">${b.stage}<b>${b.count}</b></div>
      ${b.items.map(id => `<a class="chip-s" href="${href(id)}"><span class="dot ${booked.some(s => s.id === id) ? 'new' : DOT[id] || ''}"></span><b>${id}</b></a>`).join('')}
      ${b.count > b.items.length ? `<span class="more">${b.note || `+ ${b.count - b.items.length} more`}</span>` : ''}</div>`).join('')}</div>`;
}

function costsHTML() {
  return `<section class="card flush" id="costs">
    <div class="card-head"><i data-lucide="scale"></i><h3>Cost vs quote</h3><span class="caption">Shipments where actual cost is above what you quoted</span>
      <div class="right"><span class="lock-badge"><i data-lucide="lock"></i>Internal only</span></div></div>
    <table class="table" style="margin-top:8px"><thead><tr><th>Shipment</th><th style="text-align:right">Quoted cost</th><th style="text-align:right">Actual cost</th><th style="text-align:right">Difference</th><th>Cause</th></tr></thead>
      <tbody>${O.overruns.map(o => `<tr data-href="shipment.html?id=${o.id}"><td><div class="primary-cell num">${o.id}</div><div class="sub">${esc(D.orgs[o.org].name)}</div></td>
        <td class="num" style="text-align:right">${Staff.money(o.quoted)}</td><td class="num" style="text-align:right">${Staff.money(o.actual)}</td>
        <td class="num" style="text-align:right;color:var(--danger);font-weight:600">+${Staff.money(o.actual - o.quoted)}</td><td style="font-size:13px">${esc(o.cause)}</td></tr>`).join('')}
        <tr style="cursor:default"><td><b style="font-weight:600">This month</b></td><td></td><td></td><td class="num" style="text-align:right;color:var(--danger);font-weight:600">+${Staff.money(overrun)}</td><td class="caption">Recover through surcharges where your terms allow</td></tr></tbody></table>
  </section>`;
}

function newTenantHTML() {
  const steps = [['Invite your first customer', 'They get a portal in your branding to request shipments and accept quotes. Only you can see them.', 'Invite customer', 'user-plus', 'customers.html?invite=1'],
    ['Connect your partners', 'Truckers, brokers and carriers. API partners share live availability; others reply by link.', 'Add partners', 'network', 'network.html?invite=1'],
    ['Set up your portal', 'Choose what customers see, your rate cards and margins, and your reply target.', 'Portal settings', 'settings', 'settings-portal.html']];
  return `<section class="card"><div class="card-head"><i data-lucide="rocket"></i><h2>No customers yet. Set up your business</h2><span class="caption">0 of 3 done</span></div>
    <div class="onboard">${steps.map(([t, p, a, i, h], n) => `<div class="card step"><span class="n">${n + 1}</span><h3>${t}</h3><p>${p}</p>
      ${n === 0 ? `<a class="btn-primary" href="${h}"><i data-lucide="${i}"></i>${a}</a>` : `<a class="btn-secondary" href="${h}"><i data-lucide="${i}"></i>${a}</a>`}</div>`).join('')}</div></section>`;
}

function protoSwitchHTML() {
  const s2 = [['active', 'Active company'], ['new', 'New company (no customers)']];
  return `<div class="proto-note">Sample data · prototype state: <span class="proto-switch">${s2.map(([k, l]) => `<a href="?state=${k}" class="${k === state ? 'on' : ''}">${l}</a>`).join('')}</span></div>`;
}

/* ---------------- render ---------------- */
function render() {
  const home = $('#home');
  if (state === 'new') home.innerHTML = newTenantHTML() + protoSwitchHTML();
  else home.innerHTML = kpisHTML() + quickHTML()
    + `<div class="grid"><div class="col">${delaysHTML()}</div><div class="col">${pipelineHTML()}</div></div>`
    + boardHTML() + costsHTML() + protoSwitchHTML();
  icons();
  const form = $('[data-composer]');
  if (form) LM.bindComposer(form, text => {
    const go = () => { try { sessionStorage.setItem('lm.prompt', text); sessionStorage.setItem('lm.customer', forCustomer); } catch (e) {} location.href = 'chat.html?new=1&customer=' + forCustomer; };
    if (forCustomer) go(); else Staff.pickCustomer(org => { forCustomer = org; go(); });
  });
}
render();

/* ---------------- actions ---------------- */
function fixesModal(id) {
  const d = O.delays.find(x => x.id === id);
  const m = Staff.openModal(`<div class="modal-head"><i data-lucide="wand-sparkles"></i><h2>Fixes for ${id}</h2><button class="icon-btn" data-close><i data-lucide="x"></i></button></div>
    <div class="modal-body"><span class="ai-label"><i data-lucide="sparkles"></i>AI suggestions · trade-off between time and cost</span>
      ${d.fixes.map(f => `<div class="fix${f.recommended ? ' rec' : ''}"><div><b>${esc(f.title)}</b> ${f.recommended ? tag('Recommended', 'brand', 'star') : ''}<div class="d">${esc(f.detail)}</div></div>
        <button class="btn-secondary" data-apply="${f.id}"><i data-lucide="check"></i>Apply</button>
        <div class="m"><span>New ETA</span><b>${f.eta}</b><span>Delay</span><b>${f.days}</b><span>Extra cost</span><b style="color:${f.cost ? 'var(--danger)' : 'var(--success)'}">${f.cost ? '+' + Staff.money(f.cost) : 'None'}</b></div></div>`).join('')}
    </div>`, true);
  m.querySelectorAll('[data-apply]').forEach(b => b.addEventListener('click', () => {
    const f = d.fixes.find(x => x.id === b.dataset.apply);
    Staff.closeModal(); toast(`${f.title} requested for ${id}. The partner and the customer will be updated`);
  }));
}
function notifyDraft(d) {
  const c = Staff.customer(d.org);
  return `Hi ${c.contact.split(' ')[0]}, an update on ${d.id} (${d.lane[0]} → ${d.lane[1]}): ${d.cause.replace(/\.$/, '').toLowerCase()}. The new ETA is ${d.eta} (was ${d.etaWas}). ${d.id === 'SHP-2402' ? 'We are arranging a faster connection via Port Klang that would bring it forward to Sat 5 Dec.' : 'There is no extra cost to you, and we have asked for extra free days at destination.'} We will keep you posted. ${LM.account.name}, ${T.short}`;
}
document.addEventListener('click', e => {
  const r = e.target.closest('tr[data-href]'); if (r) { location.href = r.dataset.href; return; }
  const f = e.target.closest('[data-fixes]'); if (f) { fixesModal(f.dataset.fixes); return; }
  const n = e.target.closest('[data-notify]');
  if (n) { const d = O.delays.find(x => x.id === n.dataset.notify); Staff.notifyCustomer({ shipment: d.id, org: d.org, draft: notifyDraft(d) }); return; }
  if (e.target.closest('[data-pick-customer]')) Staff.pickCustomer(org => { forCustomer = org; try { sessionStorage.setItem('lm.customer', org); } catch (e2) {} render(); $('[data-composer] textarea').focus(); });
});
$$('[data-scope]').forEach(b => b.addEventListener('click', () => {
  $$('[data-scope]').forEach(x => x.classList.toggle('selected', x === b));
  toast(b.dataset.scope === 'team' ? 'Showing the whole team’s work' : 'Showing items assigned to you');
}));
</script>
</body>
</html>
